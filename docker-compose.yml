services:
  db:
    image: postgres:16-alpine
    container_name: bunkar-mvp-db
    environment:
      POSTGRES_USER: bunkar
      POSTGRES_PASSWORD: bunkar
      POSTGRES_DB: bunkar
    ports: ["5432:5432"]
    volumes: ["bunkar-mvp-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunkar"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  bunkar-mvp-pg:
