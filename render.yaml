# Render blueprint: free temporary demo. One web service (Node API + built PWA); the database is on Neon.
# Deploy: Render dashboard → New → Blueprint → this repo, branch `deploy/demo`. See docs/deploy.md.
services:
  - type: web
    name: bunkar-demo
    runtime: node
    plan: free            # sleeps after 15 idle minutes; not for paying customers
    region: singapore
    branch: deploy/demo
    rootDir: .
    buildCommand: cd app && npm ci --include=dev && npm run build && cd ../server && npm ci
    startCommand: cd server && node index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL  # Neon direct address (no -pooler), ending in ?sslmode=verify-full
        sync: false
      - key: ADMIN_KEYS    # name:key,name:key
        sync: false
      - key: BUNKAR_SECRET
        generateValue: true
